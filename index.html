<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduNexa AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <div class="brand-logo">🎓</div>

            <div>
                <h2>EduNexa AI</h2>
                <span>Student Assistant</span>
            </div>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New Chat
        </button>

        <div class="menu">

            <button class="menu-item active" onclick="showWelcome()">
                💬 Ask AI
            </button>

            <button class="menu-item" onclick="askQuestion('Give me study tips')">
                📚 Study Help
            </button>

            <button class="menu-item" onclick="askQuestion('How can I prepare for exams?')">
                📝 Exam Help
            </button>

            <button class="menu-item" onclick="askQuestion('What is DBMS?')">
                💻 Technical
            </button>

        </div>

        <div class="sidebar-bottom">
            <div class="online">
                <span></span> Demo Assistant Online
            </div>

            <small>EduNexa AI v1.0</small>
        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- HEADER -->
        <header class="header">

            <div>
                <h1>EduNexa AI</h1>
                <p>Your intelligent college assistant</p>
            </div>

            <div class="header-buttons">

                <button onclick="toggleDarkMode()">
                    🌙
                </button>

                <button onclick="newChat()">
                    ＋
                </button>

            </div>

        </header>


        <!-- CHAT -->
        <section class="chat">

            <div id="welcome" class="welcome">

                <div class="bot-icon">
                    🤖
                </div>

                <h2>Hello! 👋</h2>

                <p>
                    I'm <b>EduNexa AI</b>, your student support assistant.
                </p>

                <p>
                    Ask me anything about your studies.
                </p>

            </div>


            <!-- QUICK QUESTIONS -->
            <div class="quick-section" id="quickSection">

                <h3>What can I help you with?</h3>

                <div class="quick-grid">

                    <button onclick="askQuestion('What is DBMS?')">
                        <span>💻</span>
                        <div>
                            <b>DBMS</b>
                            <small>Learn database concepts</small>
                        </div>
                    </button>

                    <button onclick="askQuestion('What is OOPs?')">
                        <span>🧩</span>
                        <div>
                            <b>OOPs</b>
                            <small>Understand programming</small>
                        </div>
                    </button>

                    <button onclick="askQuestion('How can I prepare for exams?')">
                        <span>📝</span>
                        <div>
                            <b>Exam Preparation</b>
                            <small>Get useful study tips</small>
                        </div>
                    </button>

                    <button onclick="askQuestion('Give me study tips')">
                        <span>📚</span>
                        <div>
                            <b>Study Help</b>
                            <small>Improve your learning</small>
                        </div>
                    </button>

                </div>

            </div>


            <!-- MESSAGES -->
            <div id="messages"></div>

        </section>


        <!-- INPUT -->
        <div class="input-area">

            <div class="input-box">

                <input
                    id="userInput"
                    type="text"
                    placeholder="Ask EduNexa AI anything..."
                    autocomplete="off"
                    onkeydown="handleEnter(event)"
                >

                <button onclick="sendMessage()">
                    ➤
                </button>

            </div>

            <p>
                ✨ EduNexa AI Demo • Student Support Assistant
            </p>

        </div>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
