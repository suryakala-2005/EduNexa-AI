<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduNexa AI - Student Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <div class="logo">🎓</div>
            <div>
                <h2>EduNexa AI</h2>
                <span>Student Assistant</span>
            </div>
        </div>

        <button class="new-chat" onclick="newChat()">
            <span>＋</span> New Chat
        </button>

        <div class="menu">

            <button class="menu-item active" onclick="showSection('ask')">
                <span>💬</span>
                Ask AI
            </button>

            <button class="menu-item" onclick="showSection('study')">
                <span>📚</span>
                Study Help
            </button>

            <button class="menu-item" onclick="showSection('exam')">
                <span>📝</span>
                Exam Information
            </button>

            <button class="menu-item" onclick="showSection('rules')">
                <span>📋</span>
                Regulations
            </button>

        </div>

        <div class="sidebar-bottom">
            <div class="status">
                <span class="online-dot"></span>
                Demo Assistant Online
            </div>

            <p>EduNexa AI v1.0</p>
        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- TOP BAR -->
        <header class="topbar">

            <div>
                <h1>EduNexa AI</h1>
                <p>Your intelligent college assistant</p>
            </div>

            <div class="top-actions">
                <button onclick="toggleTheme()" title="Theme">🌙</button>
                <button onclick="newChat()" title="New Chat">＋</button>
            </div>

        </header>


        <!-- CHAT AREA -->
        <section class="chat-area" id="chatArea">

            <!-- WELCOME -->
            <div class="welcome" id="welcome">

                <div class="bot-avatar">
                    🤖
                </div>

                <h2>Hello! 👋</h2>

                <p>
                    I'm <strong>EduNexa AI</strong>, your student support assistant.
                    <br>
                    How can I help you today?
                </p>

            </div>


            <!-- QUICK QUESTIONS -->
            <div class="quick-section">

                <h3>Quick Questions</h3>

                <div class="quick-grid">

                    <button onclick="askQuestion('What is a syllabus?')">
                        <span class="card-icon">📚</span>
                        <div>
                            <strong>Syllabus</strong>
                            <small>Understand your subjects</small>
                        </div>
                    </button>

                    <button onclick="askQuestion('How can I prepare for exams?')">
                        <span class="card-icon">📝</span>
                        <div>
                            <strong>Exam Preparation</strong>
                            <small>Get study guidance</small>
                        </div>
                    </button>

                    <button onclick="askQuestion('How can I improve my attendance?')">
                        <span class="card-icon">📊</span>
                        <div>
                            <strong>Attendance</strong>
                            <small>Learn attendance tips</small>
                        </div>
                    </button>

                    <button onclick="askQuestion('What are college regulations?')">
                        <span class="card-icon">📋</span>
                        <div>
                            <strong>Regulations</strong>
                            <small>General student rules</small>
                        </div>
                    </button>

                </div>

            </div>


            <!-- MESSAGES -->
            <div id="messages"></div>

        </section>


        <!-- INPUT -->
        <div class="input-container">

            <div class="input-box">

                <input
                    type="text"
                    id="userInput"
                    placeholder="Ask EduNexa AI anything..."
                    autocomplete="off"
                    onkeydown="handleEnter(event)"
                >

                <button class="send-btn" onclick="sendMessage()">
                    ➤
                </button>

            </div>

            <p class="note">
                ✨ EduNexa AI Demo • For important information, verify with your college.
            </p>

        </div>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
